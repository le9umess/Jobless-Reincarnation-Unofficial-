plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

// Test classes/resources stay outside the distributable mod JAR.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    // GeckoLib renders the mod's NPCs; see the dependencies block.
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('software.bernie.geckolib') }
    }
    // Epic Fight comes from Modrinth's Maven, so the public source builds without a local copy of its JAR.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup('maven.modrinth') }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            def previewProperties = ['wandPreview', 'trainingPreview', 'inputProbe', 'earthArtPreview', 'airArtPreview', 'healingArtPreview', 'waterArtPreview', 'tomeDisplayPreview', 'npcDisplayPreview', 'journalProbe', 'fireProbe']
            if (previewProperties.count { project.findProperty(it)?.toString()?.toBoolean() } > 1) {
                throw new GradleException('Enable only one development preview at a time')
            }
            previewProperties.each { propertyName ->
                if (project.hasProperty(propertyName)) {
                    if (!project.hasProperty('gameTests')) throw new GradleException("${propertyName} requires -PgameTests")
                    systemProperty "jobless_reincarnation.${propertyName}", project.property(propertyName).toString()
                }
            }
            if (project.findProperty('fireProbe')?.toString()?.toBoolean() || project.findProperty('inputProbe')?.toString()?.toBoolean() || project.findProperty('earthArtPreview')?.toString()?.toBoolean() || project.findProperty('airArtPreview')?.toString()?.toBoolean() || project.findProperty('healingArtPreview')?.toString()?.toBoolean() || project.findProperty('waterArtPreview')?.toString()?.toBoolean() || project.findProperty('tomeDisplayPreview')?.toString()?.toBoolean() || project.findProperty('npcDisplayPreview')?.toString()?.toBoolean() || project.findProperty('journalProbe')?.toString()?.toBoolean()) {
                programArguments.addAll '--quickPlaySingleplayer', 'JR Magic 0_2_0 Test'
            }
            if (project.findProperty('journalProbe')?.toString()?.toBoolean() || project.findProperty('fireProbe')?.toString()?.toBoolean()) {
                programArguments.addAll '--width', '854', '--height', '480'
            }
            if (project.hasProperty('multiplayerProbe')) {
                if (!project.hasProperty('gameTests')) throw new GradleException('multiplayerProbe requires -PgameTests')
                def probeRole = project.property('multiplayerProbe').toString()
                if (!(probeRole in ['host', 'observer'])) throw new GradleException('multiplayerProbe must be host or observer')
                if (previewProperties.any { project.findProperty(it)?.toString()?.toBoolean() }) throw new GradleException('multiplayerProbe is exclusive with other previews')
                systemProperty 'jobless_reincarnation.multiplayerProbe', probeRole
                if (probeRole == 'host') {
                    programArguments.addAll '--quickPlaySingleplayer', 'JR Magic 0_2_0 Test'
                }
                if (probeRole == 'observer') {
                    gameDirectory = project.file('run-observer')
                    programArguments.addAll '--username', 'JRObserver', '--uuid', java.util.UUID.nameUUIDFromBytes('OfflinePlayer:JRObserver'.getBytes(java.nio.charset.StandardCharsets.UTF_8)).toString()
                }
            }
            // Formal Roxy NPC check with the real entity: probe (single player), host or observer (a second client).
            if (project.findProperty('roxyNpcProbe')?.toString()?.toBoolean()) {
                if (!project.hasProperty('gameTests')) throw new GradleException('roxyNpcProbe requires -PgameTests')
                if (previewProperties.any { project.findProperty(it)?.toString()?.toBoolean() } || project.hasProperty('multiplayerProbe')
                        || project.findProperty('roxyTutorPreview')?.toString()?.toBoolean()) {
                    throw new GradleException('roxyNpcProbe is exclusive with every other preview and probe')
                }
                def npcMode = project.findProperty('roxyNpcMode')?.toString() ?: 'probe'
                if (!(npcMode in ['probe', 'host', 'observer'])) throw new GradleException('roxyNpcMode must be probe, host or observer')
                systemProperty 'jobless_reincarnation.roxyNpcProbe', 'true'
                systemProperty 'jobless_reincarnation.roxyNpcMode', npcMode
                programArguments.addAll '--width', '854', '--height', '480'
                if (npcMode == 'observer') {
                    gameDirectory = project.file('run-roxy-npc-observer')
                    programArguments.addAll '--username', 'JRObserver', '--uuid', java.util.UUID.nameUUIDFromBytes('OfflinePlayer:JRObserver'.getBytes(java.nio.charset.StandardCharsets.UTF_8)).toString()
                } else {
                    gameDirectory = project.file('run-roxy-npc')
                    programArguments.addAll '--quickPlaySingleplayer', 'JR Magic 0_2_0 Test'
                }
            }
            // Joins a running server instead of opening a world, e.g. -PquickPlayMultiplayer=localhost:25579 for the release-server check.
            if (project.hasProperty('quickPlayMultiplayer')) {
                if (previewProperties.any { project.findProperty(it)?.toString()?.toBoolean() } || project.hasProperty('multiplayerProbe')
                        || project.findProperty('roxyNpcProbe')?.toString()?.toBoolean()) {
                    throw new GradleException('quickPlayMultiplayer cannot be combined with a preview or probe')
                }
                programArguments.addAll '--quickPlayMultiplayer', project.property('quickPlayMultiplayer').toString()
            }
            // Fire Ball practice check with the real tutor: probe (single player), host or observer (a second client).
            if (project.findProperty('fireTrainingProbe')?.toString()?.toBoolean()) {
                if (!project.hasProperty('gameTests')) throw new GradleException('fireTrainingProbe requires -PgameTests')
                if (previewProperties.any { project.findProperty(it)?.toString()?.toBoolean() } || project.hasProperty('multiplayerProbe')
                        || project.findProperty('roxyTutorPreview')?.toString()?.toBoolean() || project.findProperty('roxyNpcProbe')?.toString()?.toBoolean()
                        || project.hasProperty('quickPlayMultiplayer')) {
                    throw new GradleException('fireTrainingProbe is exclusive with every other preview and probe')
                }
                def fireMode = project.findProperty('fireTrainingMode')?.toString() ?: 'probe'
                if (!(fireMode in ['probe', 'host', 'observer'])) throw new GradleException('fireTrainingMode must be probe, host or observer')
                systemProperty 'jobless_reincarnation.fireTrainingProbe', 'true'
                systemProperty 'jobless_reincarnation.fireTrainingMode', fireMode
                programArguments.addAll '--width', '854', '--height', '480'
                if (fireMode == 'observer') {
                    gameDirectory = project.file('run-fire-training-observer')
                    programArguments.addAll '--username', 'JRObserver', '--uuid', java.util.UUID.nameUUIDFromBytes('OfflinePlayer:JRObserver'.getBytes(java.nio.charset.StandardCharsets.UTF_8)).toString()
                } else {
                    gameDirectory = project.file('run-fire-training')
                    programArguments.addAll '--quickPlaySingleplayer', 'JR Magic 0_2_0 Test'
                }
            }
            // Learned-tome feedback check in one single-player world, so the client and server sides run in the same game: probe only.
            if (project.findProperty('tomeFeedbackProbe')?.toString()?.toBoolean()) {
                if (!project.hasProperty('gameTests')) throw new GradleException('tomeFeedbackProbe requires -PgameTests')
                if (previewProperties.any { project.findProperty(it)?.toString()?.toBoolean() } || project.hasProperty('multiplayerProbe')
                        || project.findProperty('roxyTutorPreview')?.toString()?.toBoolean() || project.findProperty('roxyNpcProbe')?.toString()?.toBoolean()
                        || project.hasProperty('quickPlayMultiplayer') || project.findProperty('fireTrainingProbe')?.toString()?.toBoolean()) {
                    throw new GradleException('tomeFeedbackProbe is exclusive with every other preview and probe')
                }
                systemProperty 'jobless_reincarnation.tomeFeedbackProbe', 'true'
                programArguments.addAll '--width', '854', '--height', '480'
                gameDirectory = project.file('run-tome-feedback')
                programArguments.addAll '--quickPlaySingleplayer', 'JR Magic 0_2_0 Test'
            }
            // Tutor single-press input check in one single-player world, with the real client input path: probe only.
            if (project.findProperty('tutorInputProbe')?.toString()?.toBoolean()) {
                if (!project.hasProperty('gameTests')) throw new GradleException('tutorInputProbe requires -PgameTests')
                if (previewProperties.any { project.findProperty(it)?.toString()?.toBoolean() } || project.hasProperty('multiplayerProbe')
                        || project.findProperty('roxyTutorPreview')?.toString()?.toBoolean() || project.findProperty('roxyNpcProbe')?.toString()?.toBoolean()
                        || project.hasProperty('quickPlayMultiplayer') || project.findProperty('fireTrainingProbe')?.toString()?.toBoolean()
                        || project.findProperty('tomeFeedbackProbe')?.toString()?.toBoolean()) {
                    throw new GradleException('tutorInputProbe is exclusive with every other preview and probe')
                }
                systemProperty 'jobless_reincarnation.tutorInputProbe', 'true'
                programArguments.addAll '--width', '854', '--height', '480'
                gameDirectory = project.file('run-tutor-input')
                programArguments.addAll '--quickPlaySingleplayer', 'JR Magic 0_2_0 Test'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (project.hasProperty('gameTests')) {
                sourceSet(sourceSets.gameTest)
            }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // GeckoLib renders the mod's NPCs. Players need it on both the client and the server; the release JAR does not
    // bundle it. gameTestImplementation extends implementation, so the development fixtures get it too.
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
    // Epic Fight drives the NPC and player animation from 0.31.0. Exact author release 21.17.3.1 for NeoForge 1.21.1
    // (Modrinth version 8HHhJt6i, the same file as dependencies/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar); not bundled.
    implementation 'maven.modrinth:epic-fight:8HHhJt6i'
}

// The release JAR carries both notices: GPL-3.0-or-later for the code; the mod's own art and writing are all rights reserved.
tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('LICENSE-ASSETS'))
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}





